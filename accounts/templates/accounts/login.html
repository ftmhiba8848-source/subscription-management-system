<!DOCTYPE html>
<html>
<head>
    <title>Customer Login</title>
</head>
<body>

    <h1>Welcome Back</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        New customer?
        <a href="{% url 'register' %}">Register here</a>
    </p>

</body>
</html>
