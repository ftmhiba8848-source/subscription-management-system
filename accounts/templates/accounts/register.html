<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration</title>
</head>
<body>

    <h1>Create Your Account</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already registered?
        <a href="{% url 'login' %}">Login here</a>
    </p>

</body>
</html>
