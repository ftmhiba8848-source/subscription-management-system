<!DOCTYPE html>

<html>
<head>
    <title>Add Product</title>
</head>
<body>

```
<h1>Add New Product</h1>

<form method="POST">
    {% csrf_token %}

    <label>Product Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Description:</label><br>
    <textarea name="description"></textarea><br><br>

    <label>Product Type:</label><br>
    <select name="product_type">
        <option value="software">Software</option>
        <option value="service">Service</option>
        <option value="subscription">Subscription</option>
    </select><br><br>

    <label>Sales Price:</label><br>
    <input type="number" name="sales_price" step="0.01" min="0" required><br><br>

    <label>Cost Price:</label><br>
    <input type="number" name="cost_price" step="0.01" min="0" required><br><br>

    <label>
        <input type="checkbox" name="is_active" checked>
        Active
    </label><br><br>

    <button type="submit">Save Product</button>

</form>

<br>
<a href="{% url 'product_list' %}">Back to Products</a>
```

</body>
</html>
