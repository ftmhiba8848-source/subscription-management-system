<!DOCTYPE html>

<html>
<head>
    <title>Edit Product</title>
</head>
<body>

```
<h1>Edit Product</h1>

<form method="POST">
    {% csrf_token %}

    <label>Product Name:</label><br>
    <input type="text" name="name" value="{{ product.name }}" required><br><br>

    <label>Description:</label><br>
    <textarea name="description">{{ product.description }}</textarea><br><br>

    <label>Product Type:</label><br>
    <select name="product_type">
        <option value="software" {% if product.product_type == 'software' %}selected{% endif %}>Software</option>
        <option value="service" {% if product.product_type == 'service' %}selected{% endif %}>Service</option>
        <option value="subscription" {% if product.product_type == 'subscription' %}selected{% endif %}>Subscription</option>
    </select><br><br>

    <label>Sales Price:</label><br>
    <input type="number" name="sales_price" step="0.01" min="0" value="{{ product.sales_price }}" required><br><br>

    <label>Cost Price:</label><br>
    <input type="number" name="cost_price" step="0.01" min="0" value="{{ product.cost_price }}" required><br><br>

    <label>
        <input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}>
        Active
    </label><br><br>

    <button type="submit">Update Product</button>

</form>

<br>
<a href="{% url 'product_list' %}">Back to Products</a>
```

</body>
</html>
